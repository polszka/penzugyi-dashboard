<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Családi pénzügyi dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EEF2F6;
  --ink:#1B2430; --muted:#5B6773; --faint:#8A97A6;
  --border:#E1E6ED; --border-strong:#CDD5DF;
  --accent:#2D5C8F; --accent-soft:#E7EFF7;
  --pos:#1F8F63; --pos-soft:#E3F3EC;
  --neg:#C1503E; --neg-soft:#F7E7E3;
  --warn:#B9862E;
  --shadow:0 1px 2px rgba(19,32,48,.05),0 2px 8px rgba(19,32,48,.04);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F141B; --surface:#171E27; --surface-2:#1E2833;
    --ink:#E6EBF1; --muted:#9AA7B5; --faint:#6E7C8B;
    --border:#26303B; --border-strong:#33404E;
    --accent:#6FA6DD; --accent-soft:#1C2A38;
    --pos:#43B587; --pos-soft:#152A22;
    --neg:#E27862; --neg-soft:#2C1B18;
    --warn:#D6A144;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#171E27; --surface-2:#1E2833;
  --ink:#E6EBF1; --muted:#9AA7B5; --faint:#6E7C8B;
  --border:#26303B; --border-strong:#33404E;
  --accent:#6FA6DD; --accent-soft:#1C2A38;
  --pos:#43B587; --pos-soft:#152A22;
  --neg:#E27862; --neg-soft:#2C1B18;
  --warn:#D6A144;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
.num{font-variant-numeric:tabular-nums lining-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:var(--ink)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent)}

/* Layout */
.app{display:flex;min-height:100%}
.side{
  width:224px;flex:0 0 224px;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  padding-top:env(safe-area-inset-top,0px);
}
.brand{padding:20px 20px 14px;display:flex;align-items:center;gap:10px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
.brand .t{font-weight:600;font-size:15px;line-height:1.15}
.brand .t small{display:block;color:var(--faint);font-weight:400;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px;padding:8px 12px;overflow-y:auto}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:none;color:var(--muted);padding:9px 12px;border-radius:8px;font-weight:500;
}
.nav button .ic{width:18px;text-align:center;opacity:.85}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .foot{margin-top:auto;padding:14px;color:var(--faint);font-size:11.5px;border-top:1px solid var(--border)}
.themebtn{background:var(--surface-2);border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 10px;width:100%;margin-top:8px}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:none;align-items:center;gap:10px;padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;
}
.content{padding:24px;max-width:1120px;width:100%;margin:0 auto}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:22px}
.page-h .sub{color:var(--muted);font-size:13px;margin-top:2px}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:18px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.tile{padding:16px 18px}
.tile .lab{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.tile .val{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:-.02em}
.tile .val.sm{font-size:20px}
.tile .meta{color:var(--faint);font-size:12px;margin-top:3px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .accent{color:var(--accent)} .warn{color:var(--warn)}

/* Hero */
.hero{padding:22px 24px;display:flex;flex-wrap:wrap;gap:26px;align-items:center;justify-content:space-between}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.025em;line-height:1}
.hero .big .cur{font-size:22px;color:var(--muted);font-weight:500;margin-left:4px}
.hero .lab{color:var(--muted);font-size:13px;font-weight:500;margin-bottom:8px}
.flowbar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex;margin-top:14px;max-width:520px}
.flowbar .in{background:var(--pos)} .flowbar .out{background:var(--neg)}
.flowlegend{display:flex;gap:18px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.flowlegend b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

/* Controls */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=date],input[type=month],select{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:0;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
select{cursor:pointer}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 15px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border-strong)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{background:var(--neg)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px}
.seg button{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:7px;font-weight:500;font-size:13.5px}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}

/* Table */
.tbl-wrap{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--surface-2);position:sticky;top:0}
td.amt{text-align:right;font-weight:600}
td.desc{white-space:normal;min-width:220px;max-width:360px;color:var(--ink)}
tr:hover td{background:var(--surface-2)}
.catsel{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:12.5px;max-width:180px}
/* Transaction cards (mobile-friendly) */
.txlist{display:flex;flex-direction:column}
.txcard{padding:12px 14px;border-bottom:1px solid var(--border)}
.txcard:last-child{border-bottom:none}
.txcard-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.txcard-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;min-width:0}
.txcard-date{color:var(--faint)}
.txcard-amt{font-weight:700;font-size:16px;white-space:nowrap;flex:0 0 auto}
.txcard-desc{margin:7px 0 9px;font-size:13.5px;word-break:break-word;color:var(--ink)}
.txcard-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.txcard-ctrl .catsel{max-width:none;flex:1 1 140px;min-width:120px}
.txcard-ctrl .iconbtn{flex:0 0 auto;border:1px solid var(--border)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge.me{background:var(--accent-soft);color:var(--accent)}
.badge.wife{background:var(--pos-soft);color:var(--pos)}
.iconbtn{background:transparent;border:none;color:var(--faint);padding:4px 6px;border-radius:6px}
.iconbtn:hover{background:var(--surface-2);color:var(--neg)}

/* Empty / info */
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .em{font-size:34px;margin-bottom:10px;opacity:.6}
.empty h3{color:var(--ink);margin-bottom:6px}
.note{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);display:flex;gap:10px}
.note .em{flex:0 0 auto}
.note.warn{background:var(--neg-soft)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.overlay.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:620px;max-height:88vh;overflow:auto}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
.close{background:transparent;border:none;color:var(--muted);font-size:20px;line-height:1;padding:4px 8px;border-radius:6px}
.close:hover{background:var(--surface-2)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formgrid .full{grid-column:1/-1}

.section-title{font-size:13px;color:var(--muted);font-weight:600;margin:22px 0 10px}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none}
.list-item .li-main{min-width:0}
.list-item .li-name{font-weight:600}
.list-item .li-meta{color:var(--faint);font-size:12.5px;margin-top:2px}
.progress{height:7px;border-radius:5px;background:var(--surface-2);overflow:hidden;margin-top:8px;max-width:360px}
.progress .p{height:100%;background:var(--accent)}
.kv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.kv .k{background:var(--surface-2);border-radius:7px;padding:4px 9px;font-size:12px;color:var(--muted)}
.kv .k b{color:var(--ink);font-weight:600}
canvas{max-width:100%}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:220px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-size:13.5px;z-index:200;opacity:0;transition:opacity .2s;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.show{opacity:1}
.hidden{display:none!important}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.maprow .src{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.spin{display:inline-block;width:15px;height:15px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media (max-width:860px){
  .side{display:none}
  .topbar{display:flex}
  .content{padding:16px}
  .hero .big{font-size:32px}
  .formgrid{grid-template-columns:1fr}
  .main{height:auto}
}
.mobnav{display:none}
@media (max-width:860px){
  .mobnav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:19;-webkit-overflow-scrolling:touch}
  .mobnav button{flex:0 0 auto;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:7px 13px;font-weight:500;font-size:13px}
  .mobnav button.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo">Ft</div>
      <div class="t">Pénzügyi dashboard<small>Családi kiadás &amp; vagyon</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      Az adatok csak ebben a böngészőben tárolódnak, sehova nem töltődnek fel.
      <button class="themebtn" id="themeBtn">🌓 Téma váltása</button>
      <div id="appVer" style="margin-top:8px;color:var(--faint);font-size:11px"></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="brand" style="padding:0;flex:1">
        <div class="logo">Ft</div>
        <div class="t">Pénzügyi dashboard</div>
      </div>
      <button class="themebtn" id="themeBtn2" style="width:auto">🌓</button>
    </div>
    <div class="mobnav" id="mobnav"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k==="html")e.innerHTML=a[k];else if(k.startsWith("on")&&typeof a[k]==="function")e.addEventListener(k.slice(2),a[k]);else if(a[k]!==false&&a[k]!=null)e.setAttribute(k,a[k]);}c.flat().forEach(x=>e.append(x&&x.nodeType?x:document.createTextNode(x==null?"":x)));return e;};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

const HUF=new Intl.NumberFormat("hu-HU",{style:"currency",currency:"HUF",maximumFractionDigits:0});
const NUM=new Intl.NumberFormat("hu-HU",{maximumFractionDigits:0});
const NUM2=new Intl.NumberFormat("hu-HU",{maximumFractionDigits:2});
const money=v=>HUF.format(Math.round(v||0));
const signMoney=v=>(v>0?"+":"")+HUF.format(Math.round(v||0));
const todayISO=()=>new Date().toISOString().slice(0,10);
const monthOf=iso=>(iso||"").slice(0,7);
function daysBetween(a,b){const d1=new Date(a),d2=new Date(b);return Math.max(0,Math.round((d2-d1)/86400000));}
function monthsBetween(fromYM,toDate){const[fy,fm]=fromYM.split("-").map(Number);const d=new Date(toDate);return (d.getFullYear()-fy)*12+(d.getMonth()+1-fm);}
function addMonthsYM(ym,n){let[y,m]=ym.split("-").map(Number);const idx=(y*12+(m-1))+n;return Math.floor(idx/12)+"-"+String(idx%12+1).padStart(2,"0");}

function parseHUNumber(raw){
  if(raw==null)return NaN;
  let s=String(raw).trim().replace(/\u00a0/g," ").replace(/\s/g,"").replace(/(HUF|Ft|EUR|€|USD|\$)/gi,"");
  if(s==="")return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(s.includes(",")){ s=s.replace(/\./g,"").replace(",", "."); }
  else if(s.includes(".")){
    const parts=s.split(".");
    if(parts.length>2){ s=parts.join(""); }               // 1.234.567 -> thousands
    else if(parts[1] && parts[1].length===3){ s=parts.join(""); } // 100.000 -> thousands
    // else keep as decimal (12.5)
  }
  let v=parseFloat(s);
  if(isNaN(v))return NaN;
  if(neg)v=-v;
  return v;
}
function parseAnyDate(raw){
  if(!raw)return null;
  let s=String(raw).trim().replace(/\./g,"-").replace(/\//g,"-").replace(/-+$/,"").replace(/\s.*$/,"");
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})-(\d{1,2})-(\d{4})$/);
  if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  const d=new Date(raw);
  if(!isNaN(d))return d.toISOString().slice(0,10);
  return null;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}

/* ---------------- state ---------------- */
const LS_KEY="csaladi_penzugy_v1";
const UNICREDIT_CATS=["Élelmiszer","Közműdíj","Otthon","Közlekedés","Vásárlás és szolgáltatás","Szabadidő","Szórakozás","Életmód","Gyermekgondozás","Oktatás","Utazás","Biztosítás","Banki díj és hitel","Adó és bírság","Készpénz","Megtakarítás","Költségvetésben nem számolt tétel"];
const DEFAULT_CATS=[...UNICREDIT_CATS];
const UNCAT="Nem kategorizált költség";
const SAVE_CAT="Megtakarítás";
const FIXED_DEFAULT=["Közműdíj","Élelmiszer","Biztosítás","Banki díj és hitel"];
const CAT_VERSION=2;
const APP_VERSION="1.8";
// Régi (korábbi verzió) kategórianevek -> UniCredit főkategóriák. Egyszeri automatikus átálláshoz.
const OLD_TO_NEW={
  "Rezsi":"Közműdíj","Lakhatás":"Otthon","Háztartás":"Otthon",
  "Autó / Üzemanyag":"Közlekedés","Egészség":"Életmód","Gyerek":"Gyermekgondozás",
  "Étterem / Kávé":"Szabadidő","Ruházat":"Vásárlás és szolgáltatás","Előfizetések":"Szórakozás",
  "Hitel törlesztés":"Banki díj és hitel","Megtakarítás / Befektetés":"Megtakarítás","Bankköltség":"Banki díj és hitel",
  "Egyéb":"Nem kategorizált költség","Fizetés":"Nem kategorizált költség","Egyéb bevétel":"Nem kategorizált költség","Kategorizálatlan":"Nem kategorizált költség"
};
// Merchant Category Code (MCC) -> UniCredit főkategória. Kártyás tételeknél a bank a leírásba teszi.
const MCC_MAP={
  "5411":"Élelmiszer","5412":"Élelmiszer","5422":"Élelmiszer","5441":"Élelmiszer","5451":"Élelmiszer","5462":"Élelmiszer","5499":"Élelmiszer","5921":"Élelmiszer",
  "5811":"Szabadidő","5812":"Szabadidő","5813":"Szabadidő","5814":"Szabadidő","5941":"Szabadidő","5942":"Szabadidő","7911":"Szabadidő","7922":"Szabadidő","7929":"Szabadidő","7932":"Szabadidő","7933":"Szabadidő","7941":"Szabadidő","7991":"Szabadidő","7992":"Szabadidő","7993":"Szabadidő","7994":"Szabadidő","7996":"Szabadidő","7997":"Szabadidő","7998":"Szabadidő","7999":"Szabadidő",

function subcatsOf(cat){return (state.subcats&&state.subcats[cat])||[];}
function validSub(cat,sub){return (sub&&subcatsOf(cat).includes(sub))?sub:"";}
// Egy tétel besorolása: {cat, sub}
function categorizeTxn(txn){
  const nd=normDesc(txn.description);
  if(txn.category&&txn.category!==UNCAT)return {cat:txn.category,sub:validSub(txn.category,txn.subcategory||"")};
  if(state.rules[nd])return {cat:state.rules[nd],sub:validSub(state.rules[nd],(state.ruleSubs&&state.ruleSubs[nd])||"")};
  for(const r of (state.substrRules||[])){ if(nd.includes(r.text.toLowerCase()))return {cat:r.cat,sub:""}; }
  if(txn.mcc){
    if(MCC_SUB[txn.mcc]){const cs=MCC_SUB[txn.mcc];if(state.categories.includes(cs[0]))return {cat:cs[0],sub:validSub(cs[0],cs[1])};}
    if(MCC_MAP[txn.mcc]&&state.categories.includes(MCC_MAP[txn.mcc]))return {cat:MCC_MAP[txn.mcc],sub:""};
  }
  const ms=merchantSub(txn.description); if(ms&&state.categories.includes(ms[0]))return {cat:ms[0],sub:validSub(ms[0],ms[1])};
  const mc=merchantCat(txn.description); if(mc&&state.categories.includes(mc))return {cat:mc,sub:""};
  return {cat:UNCAT,sub:""};
}

function normDesc(d){return String(d||"").toLowerCase().replace(/\s+/g," ").replace(/[0-9]{6,}/g,"").trim().slice(0,60);}
function applyRules(txn){return categorizeTxn(txn).cat;}
function autoCategorizeUncategorized(){
  let n=0;
  state.transactions.forEach(t=>{
    if(t.category&&t.category!==UNCAT)return;
    const r=categorizeTxn(Object.assign({},t,{category:UNCAT}));
    if(r.cat!==UNCAT){t.category=r.cat;t.subcategory=validSub(r.cat,r.sub);n++;}
  });
  save();return n;
}
function renameCategory(oldN,newN){
  state.categories=state.categories.map(c=>c===oldN?newN:c);
  state.transactions.forEach(t=>{if(t.category===oldN)t.category=newN;});
  for(const k in state.rules)if(state.rules[k]===oldN)state.rules[k]=newN;
  (state.substrRules||[]).forEach(r=>{if(r.cat===oldN)r.cat=newN;});
  state.fixedCategories=(state.fixedCategories||[]).map(x=>x===oldN?newN:x);
  (state.plans||[]).forEach(p=>{if(p.category===oldN)p.category=newN;});
  if(state.subcats&&state.subcats[oldN]){state.subcats[newN]=state.subcats[oldN];delete state.subcats[oldN];}
}
function loadUnicreditCats(){
  if(!confirm("Betöltöd a UniCredit főkategóriákat? Ez lecseréli a jelenlegi kategórialistát. A besorolást igyekszem megőrizni, a nem illeszkedő tételeket „"+UNCAT+"” alá teszem, majd újra lefuttatom az automatikus kategorizálást."))return;
  state.categories=[...UNICREDIT_CATS];
  state.fixedCategories=[...FIXED_DEFAULT];
  state.subcats=JSON.parse(JSON.stringify(UNICREDIT_SUBCATS));
  const allowed=new Set([UNCAT,...state.categories]);
  state.transactions.forEach(t=>{if(!t.category||!allowed.has(t.category))t.category=UNCAT;});
  for(const k in state.rules)if(!allowed.has(state.rules[k]))delete state.rules[k];
  state.substrRules=(state.substrRules||[]).filter(r=>allowed.has(r.cat));
  const n=autoCategorizeUncategorized();
  save();renderSettings();
  toast("UniCredit kategóriák betöltve"+(n?", "+n+" tétel újrakategorizálva":""));
}
function migrateCategories(){
  const hasOld=(state.categories||[]).some(c=>OLD_TO_NEW[c])||(state.transactions||[]).some(t=>OLD_TO_NEW[t.category]);
  if(state.catVersion===CAT_VERSION && !hasOld)return false;
  const remap=c=>{ if(c==null||c==="")return c; return OLD_TO_NEW[c]||c; };
  const oldKnown=new Set(Object.keys(OLD_TO_NEW).concat(UNICREDIT_CATS));
  const customs=(state.categories||[]).filter(c=>!oldKnown.has(c)); // saját, megtartandó kategóriák
  state.categories=[...UNICREDIT_CATS,...customs];
  state.subcats=Object.assign(JSON.parse(JSON.stringify(UNICREDIT_SUBCATS)),state.subcats||{});
  state.fixedCategories=[...FIXED_DEFAULT];
  const allowed=new Set([UNCAT,...state.categories]);
  (state.transactions||[]).forEach(t=>{
    t.category=remap(t.category);
    if(!t.category||!allowed.has(t.category))t.category=UNCAT;
    if(!subcatsOf(t.category).includes(t.subcategory||""))t.subcategory="";
  });
  const nr={}; for(const k in (state.rules||{})){const v=remap(state.rules[k]); if(v&&v!==UNCAT&&allowed.has(v))nr[k]=v;} state.rules=nr;
  state.substrRules=(state.substrRules||[]).map(r=>({text:r.text,cat:remap(r.cat)})).filter(r=>allowed.has(r.cat));
  (state.plans||[]).forEach(p=>{if(p.category)p.category=remap(p.category);});
  state.catVersion=CAT_VERSION;
  autoCategorizeUncategorized();
  save();
  return true;
}
function ensureSubcats(){
  if(!state.subcats)state.subcats={};
  const missingKey=Object.keys(UNICREDIT_SUBCATS).some(cat=>!(cat in state.subcats));
  if(state.subcatsVersion===SUBCATS_VERSION && !missingKey)return;
  Object.keys(UNICREDIT_SUBCATS).forEach(cat=>{
    const cur=(state.subcats[cat]||[]).slice();
    UNICREDIT_SUBCATS[cat].forEach(sc=>{ if(!cur.includes(sc))cur.push(sc); });
    state.subcats[cat]=cur;
  });
  state.subcatsVersion=SUBCATS_VERSION;
  save();
}

}

/* investments */
function fxFieldFor(ccy){return ccy==="USD"?"usdHuf":"eurHuf";}
function latestFx(ccy){
  if(ccy==="HUF")return 1;
  const f=fxFieldFor(ccy);
  const arr=(state.fxRates||[]).filter(x=>x[f]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  return arr.length?arr[arr.length-1][f]:null;
}
function fxOn(date,ccy){
  if(ccy==="HUF")return 1;
  const f=fxFieldFor(ccy);
  const arr=(state.fxRates||[]).filter(x=>x[f]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!arr.length)return null;
  if(!date)return arr[arr.length-1][f];
  let best=null;
  for(const r of arr){ if(r.date<=date)best=r; else break; }
  return (best||arr[0])[f];
}
function investCurrentValue(inv){
  if(inv.type==="bond"){
    const face=inv.face||0;
    const refDate=inv.lastCoupon||inv.purchase||todayISO();
    const d=daysBetween(refDate,todayISO());
    const accrued=face*((inv.rate||0)/100)*(d/365);
    return {value:face+accrued, accrued, principal:face, curFx:1, costFx:1};
  } else {
    const ccy=inv.ccy||"HUF";
    const curFx = ccy==="HUF" ? 1 : (latestFx(ccy) || inv.fx || 1);
    const costFx = ccy==="HUF" ? 1 : (fxOn(inv.purchase,ccy) || inv.fx || curFx);
    const value=(inv.qty||0)*(inv.price||0)*curFx;
    const principal=(inv.qty||0)*(inv.cost||inv.price||0)*costFx;
    return {value, accrued:0, principal, curFx, costFx};
  }
}
function investTotals(){
  let total=0,principal=0,bond=0,stock=0;
  state.investments.forEach(i=>{const c=investCurrentValue(i);total+=c.value;principal+=c.principal;if(i.type==="bond")bond+=c.value;else stock+=c.value;});
  return {total,principal,bond,stock,gain:total-principal};
}

function tbszStatus(openYear){
  const N=Math.round(openYear||0);
  if(!N)return null;
  const now=new Date();
  const d3=new Date(N+3,11,31), d5=new Date(N+5,11,31);
  const newRules=N>=2025;
  let phase,tax,cls;
  if(now.getFullYear()<=N){ phase="Gyűjtőév – még befizethetsz"; tax=newRules?"korai feltörés: 28%":"korai feltörés: 15%"; cls="warn"; }
  else if(now<d3){ phase="Lekötési időszak (3 év előtt)"; tax=newRules?"feltöréskor 28% (15% szja + 13% szocho)":"feltöréskor 15% szja"; cls="neg"; }
  else if(now<d5){ phase="3 év letelt – kedvezményes"; tax=newRules?"kivét: 18% (10% + 8%)":"kivét: 10% szja"; cls="warn"; }
  else { phase="Lejárt – adómentesen kivehető"; tax="0% (adómentes)"; cls="pos"; }
  return {phase,tax,cls,reduced:(N+3)+". dec. 31.",mature:(N+5)+". dec. 31.",newRules};
}

/* loans */
function loanSchedule(loan){
  const n=Math.max(0,Math.round(loan.term||0));
  const defer=Math.max(0,Math.round(loan.defer||0));
  const P=loan.principal||0;
  const r=(loan.rate||0)/12/100;
  let pay=loan.payment||0;
  if(!pay){ pay = r>0 ? P*r/(1-Math.pow(1+r,-n)) : (n>0?P/n:0); }
  const bal=[P];let b=P,totalInt=0;
  for(let d=1;d<=defer;d++){ bal.push(b); }   // türelmi idő: nincs törlesztés, 0%-nál kamat sem
  for(let k=1;k<=n;k++){
    const interest=b*r; totalInt+=interest;
    let principalPart=pay-interest;
    b=Math.max(0,b-principalPart);
    bal.push(b);
  }
  const total=defer+n;
  const elapsed=Math.min(total,Math.max(0,monthsBetween(loan.start,todayISO())));
  const remaining=bal[elapsed]!=null?bal[elapsed]:0;
  const payoff=addMonthsYM(loan.start,total);
  return {n:total,term:n,defer,pay,bal,totalInt,elapsed,remaining,payoff};
}

}
function isFixedCat(cat){return (state.fixedCategories||[]).includes(cat);}
function monthlyFixed(month,owner){
  let s=0;
  state.transactions.forEach(t=>{
    if(month!=="all"&&monthOf(t.date)!==month)return;
    if(owner!=="all"&&t.owner!==owner)return;
    if(t.amount<0&&isFixedCat(t.category))s+=-t.amount;

function monthIdx(ym){const p=ym.split("-").map(Number);return p[0]*12+(p[1]-1);}
function combinedLoanSeries(){
  const loans=state.loans.filter(l=>(l.term||0)>0&&(l.principal||0)>0);
  if(!loans.length)return null;
  const scheds=loans.map(l=>({l,sch:loanSchedule(l)}));
  let startI=Infinity,endI=-Infinity;
  scheds.forEach(({l,sch})=>{const si=monthIdx(l.start);startI=Math.min(startI,si);endI=Math.max(endI,si+sch.n);});
  if(!isFinite(startI))return null;
  const labels=[],data=[];
  for(let i=startI;i<=endI;i++){
    const ym=Math.floor(i/12)+"-"+String(i%12+1).padStart(2,"0");
    let tot=0;
    scheds.forEach(({l,sch})=>{const k=i-monthIdx(l.start);if(k>=0&&k<sch.n)tot+=sch.bal[k];});
    labels.push(ym);data.push(Math.round(tot));
  }
  return {labels,data};
}

function onFilePicked(e){
  const file=e.target.files[0];if(!file)return;
  importCtx.fileName=file.name;
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      let aoa;
      if(ext==="xlsx"||ext==="xls"){
        if(typeof XLSX==="undefined"){toast("A táblázat-beolvasó (XLSX) nem töltött be. Ellenőrizd az internetkapcsolatot.");return;}
        const wb=XLSX.read(new Uint8Array(reader.result),{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:null});
      }else{
        const text=decodeBuffer(reader.result);
        let res=Papa.parse(text.trim(),{header:false,skipEmptyLines:true});
        aoa=res.data;
        if(aoa.length && (aoa[0]||[]).length<=1){
          const r2=Papa.parse(text.trim(),{header:false,skipEmptyLines:true,delimiter:";"});
          if(r2.data.length && (r2.data[0]||[]).length>1)aoa=r2.data;
        }
      }
      detectHeaderAndBuild(aoa);
    }catch(err){console.error(err);toast("Nem sikerült beolvasni a fájlt: "+err.message);}
  };
  reader.readAsArrayBuffer(file);
}
function decodeBuffer(buf){
  const bytes=new Uint8Array(buf);
  let text;
  try{text=new TextDecoder("utf-8",{fatal:false}).decode(bytes);}catch(e){text="";}
  const bad=(text.match(/\uFFFD/g)||[]).length;
  if(bad>2 || /Ã¡|Ã©|Ã­|Å‘|Å±|Ã¶|Ã¼/.test(text)){
    try{ text=new TextDecoder("windows-1250",{fatal:false}).decode(bytes); }catch(e){}
  }
  return text;
}
const HEADER_HINTS={
  date:["dátum","datum","date","érték","teljesít","könyvel"],
  amount:["összeg","osszeg","amount","terhel","jóvá","jova","követel","tartozik"]
};
function rowScore(row){
  const cells=(row||[]).map(c=>String(c==null?"":c).toLowerCase());
  const hasDate=cells.some(c=>HEADER_HINTS.date.some(k=>c.includes(k)));
  const hasAmt=cells.some(c=>HEADER_HINTS.amount.some(k=>c.includes(k)));
  const nonEmpty=cells.filter(c=>c.trim()!=="").length;
  return (hasDate?1:0)+(hasAmt?1:0)+(nonEmpty>=3?0.5:0)+(hasDate&&hasAmt?1:0);
}
function detectHeaderAndBuild(aoa){
  aoa=(aoa||[]).filter(r=>Array.isArray(r));
  if(!aoa.length){toast("A fájl üresnek tűnik.");return;}
  let bestIdx=0,bestScore=-1;
  const limit=Math.min(aoa.length,20);
  for(let i=0;i<limit;i++){const s=rowScore(aoa[i]);if(s>bestScore){bestScore=s;bestIdx=i;}}
  const rawHeaders=(aoa[bestIdx]||[]).map(c=>String(c==null?"":c).trim());
  const headers=rawHeaders.map(h=> (h && !h.startsWith("****")) ? h : "");
  const rows=[];
  for(let i=bestIdx+1;i<aoa.length;i++){
    const r=aoa[i];if(!r||!r.some(c=>c!=null&&String(c).trim()!==""))continue;
    const obj={};headers.forEach((h,j)=>{if(h)obj[h]=r[j];});
    rows.push(obj);
  }
  importCtx.rows=rows;
  importCtx.fields=headers.filter(h=>h!=="");
  importCtx.headerRowIndex=bestIdx;
  importCtx.statusField=importCtx.fields.find(f=>/st[aá]tusz|status/i.test(f))||"";
  importCtx.onlyBooked=true;
  importCtx.map={date:"",amount:"",debit:"",credit:"",desc:""};
  buildMappingUI();
}
function guessField(fields,cands){
  const low=fields.map(f=>f.toLowerCase());
  for(const c of cands){const i=low.indexOf(c);if(i>=0)return fields[i];}
  for(const c of cands){const i=low.findIndex(f=>f.includes(c));if(i>=0)return fields[i];}
  return "";
}
function guessDesc(fields){
  const low=fields.map(f=>f.toLowerCase());
  const pref=["partner","közlemény","kozlemeny","tranzakció részletek","tranzakcio reszletek","megnevezés","megnevezes","leírás","leiras"];
  for(const p of pref){const i=low.indexOf(p);if(i>=0)return fields[i];}
  const kw=["megnevez","közlem","kozlem","részlet","reszlet","partner","leírás","leiras","narrative","forgalom"];
  for(const k of kw){const i=low.findIndex(f=>f.includes(k)&&!f.includes("szám")&&!f.includes("szam"));if(i>=0)return fields[i];}
  return "";
}

  if(!m.mode){

  refreshPreview();

function field2(lab,input){return el("div",{class:"field"},el("label",{},lab),input);}
function buildParsedRows(){
  const m=importCtx.map;const out=[];
  const sf=importCtx.statusField, onlyBooked=importCtx.onlyBooked;
  const pending=["foglalt","függ","fugg","pending","reserved","authoriz","zárol","zarol"];
  importCtx.rows.forEach(r=>{
    if(sf&&onlyBooked){
      const st=String(r[sf]==null?"":r[sf]).toLowerCase();
      if(pending.some(p=>st.includes(p)))return;
    }
    const date=parseAnyDate(r[m.date]);
    if(!date)return;
    let amount=NaN;
    if(m.mode==="single"){amount=parseHUNumber(r[m.amount]);}
    else{
      const deb=parseHUNumber(r[m.debit]);const cre=parseHUNumber(r[m.credit]);
      amount=((isNaN(cre)?0:Math.abs(cre)) - (isNaN(deb)?0:Math.abs(deb)));
      if(isNaN(deb)&&isNaN(cre))amount=NaN;
    }
    if(isNaN(amount))return;
    if(amount===0&&m.mode==="split")return;
    const desc=(m.desc?String(r[m.desc]==null?"":r[m.desc]):"").trim();
    let mcc="";
    for(const k in r){const c=mccOf(r[k]);if(c){mcc=c;break;}}
    out.push({date,amount,description:desc,mcc});
  });
  return out;
}
function refreshPreview(){

    const isUncat=(!ex.category||ex.category===UNCAT);

  });

  c.append(el("div",{class:"page-h"},

  const totalRemaining=state.loans.reduce((a,l)=>a+loanSchedule(l).remaining,0);
  c.append(el("div",{class:"grid tiles",style:"margin:14px 0"},
    tile("Összes fennálló tartozás",money(totalRemaining),"neg",state.loans.length+" hitel")));

  state.loans.forEach(loan=>{
    const sch=loanSchedule(loan);
    const paidPct=loan.principal>0?Math.round((1-sch.remaining/loan.principal)*100):0;
    const card=el("div",{class:"card pad",style:"margin-bottom:14px"});
    const h=el("div",{class:"row",style:"justify-content:space-between;align-items:center;margin-bottom:8px"},
      el("h3",{},loan.name),
      el("button",{class:"iconbtn",title:"Hitel törlése",onclick:()=>{if(confirm("Törlöd: "+loan.name+"?")){state.loans=state.loans.filter(x=>x.id!==loan.id);save();renderLoans();}}},"✕"));
    card.append(h);

    // editable fields
    const grid=el("div",{class:"formgrid"});
    const mk=(lab,key,type,ph)=>{
      const inp=el("input",{type:type||"text",value:loan[key]!=null?loan[key]:"",placeholder:ph||""});
      inp.addEventListener("change",e=>{loan[key]=type==="month"?e.target.value:(key==="name"?e.target.value:parseHUNumber(e.target.value)||(e.target.value===""?0:parseHUNumber(e.target.value)));if(key==="name")loan[key]=e.target.value;save();renderLoans();});
      return field2(lab,inp);
    };
    const nameI=el("input",{type:"text",value:loan.name});nameI.addEventListener("change",e=>{loan.name=e.target.value;save();});
    const princI=el("input",{type:"text",value:loan.principal||"",placeholder:"pl. 25 000 000"});princI.addEventListener("change",e=>{loan.principal=parseHUNumber(e.target.value)||0;save();renderLoans();});
    const rateI=el("input",{type:"text",value:(loan.rate===0||loan.rate)?loan.rate:"",placeholder:"pl. 5,5 (0 = kamatmentes)"});rateI.addEventListener("change",e=>{loan.rate=parseHUNumber(e.target.value)||0;save();renderLoans();});
    const termI=el("input",{type:"text",value:loan.term||"",placeholder:"hónapok száma, pl. 240"});termI.addEventListener("change",e=>{loan.term=Math.round(parseHUNumber(e.target.value)||0);save();renderLoans();});
    const startI=el("input",{type:"month",value:loan.start||monthOf(todayISO())});startI.addEventListener("change",e=>{loan.start=e.target.value;save();renderLoans();});
    const deferI=el("input",{type:"text",value:loan.defer||"",placeholder:"pl. 36 (babaváró: 3 év)"});deferI.addEventListener("change",e=>{loan.defer=Math.round(parseHUNumber(e.target.value)||0);save();renderLoans();});
    const payI=el("input",{type:"text",value:loan.payment||"",placeholder:"auto, ha üres"});payI.addEventListener("change",e=>{loan.payment=parseHUNumber(e.target.value)||0;save();renderLoans();});
    grid.append(
      field2("Elnevezés",nameI),
      field2("Induló tőke (Ft)",princI),
      field2("Éves kamat (%)",rateI),
      field2("Futamidő – törlesztő hónapok",termI),
      field2("Kezdés / szerződés (év-hó)",startI),
      field2("Türelmi idő (hónap)",deferI),
      field2("Havi törlesztő (Ft)",payI));
    card.append(grid);

    // summary
    const kv=el("div",{class:"kv"},
      el("div",{class:"k"},"Havi törlesztő: ",el("b",{},money(sch.pay))),
      el("div",{class:"k"},"Fennálló tőke: ",el("b",{},money(sch.remaining))),
      el("div",{class:"k"},"Ledolgozva: ",el("b",{},paidPct+"%")),
      el("div",{class:"k"},"Eltelt: ",el("b",{},sch.elapsed+" / "+sch.n+" hó")),

      el("div",{class:"k"},"Utolsó törlesztés: ",el("b",{},sch.payoff)));
    if(sch.defer>0){

        el("div",{class:"k"},"Türelmi idő: ",el("b",{},sch.defer+" hó")),
        el("div",{class:"k"},"Törlesztés kezdete: ",el("b",{},addMonthsYM(loan.start,sch.defer))));
    }
    card.append(kv);
    card.append(el("div",{class:"progress",style:"max-width:none"},el("div",{class:"p",style:`width:${paidPct}%`})));
    // chart
    card.append(el("div",{class:"chart-box",style:"margin-top:14px"},el("canvas",{id:"loanChart_"+loan.id})));
    c.append(card);

    // draw
    setTimeout(()=>{
      const labels=sch.bal.map((_,i)=>addMonthsYM(loan.start,i));
      makeChart("loanChart_"+loan.id,{type:"line",data:{labels:labels.map(l=>l.slice(2)),datasets:[{

      }]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>money(x.raw)}}},
        scales:{x:{ticks:{color:cssVar("--muted"),maxTicksLimit:12,font:{size:10}},grid:{display:false}},y:{ticks:{color:cssVar("--muted"),font:{size:10},callback:v=>NUM.format(v)},grid:{color:cssVar("--border")}}}}});
    },0);
  });
}

function recordSnapshot(){
  const val=investTotals().total;
  if(!val){toast("Nincs mit rögzíteni – előbb vigyél fel befektetést.");return;}
  const d=todayISO();
  const byAccount={};
  (state.accounts||[]).forEach(a=>{byAccount[a.id]=Math.round(accountTotals(a.id).total);});
  const unassigned=state.investments.filter(i=>!i.accountId||!(state.accounts||[]).some(a=>a.id===i.accountId)).reduce((s,i)=>s+investCurrentValue(i).value,0);
  const rec={date:d,value:Math.round(val),byAccount,unassigned:Math.round(unassigned)};
  const ex=(state.snapshots||[]).find(s=>s.date===d);
  if(ex)Object.assign(ex,rec); else state.snapshots.push(Object.assign({id:uid()},rec));
  save();toast("Pillanatkép rögzítve: "+money(val));renderInvest();
}

async function fxFetchCore(){
  const today=todayISO();
  const start="2023-01-01";
  const urls=[
    "https://api.frankfurter.dev/v1/"+start+".."+today+"?base=EUR&symbols=USD,HUF",
    "https://api.frankfurter.app/"+start+".."+today+"?from=EUR&to=USD,HUF"
  ];
  let data=null;
  for(const u of urls){
    try{ const r=await fetch(u); if(!r.ok)throw new Error("HTTP "+r.status); const j=await r.json(); if(j&&j.rates){data=j;break;} }
    catch(e){ /* blocked (published CSP) or offline */ }
  }
  if(!data||!data.rates)return {ok:false,count:0};
  if(!state.fxRates)state.fxRates=[];
  let n=0;
  Object.keys(data.rates).forEach(dt=>{
    const HUF=data.rates[dt].HUF, USD=data.rates[dt].USD;
    if(HUF==null)return;
    const rec={date:dt,eurHuf:+HUF,usdHuf:USD?+(HUF/USD).toFixed(4):0};
    const ex=state.fxRates.find(x=>x.date===dt);
    if(ex)Object.assign(ex,rec); else state.fxRates.push(rec);
    n++;
  });
  state.fxLastFetch=Date.now();
  save();
  return {ok:true,count:n};
}
async function fetchFxLive(){
  toast("Lekérés a Frankfurter API-ról…");
  const r=await fxFetchCore();
  if(r.ok){ renderInvest(); toast(r.count+" napi árfolyam betöltve (Frankfurter / ECB)"); }
  else { toast("Nem sikerült lekérni – a közzétett claude.ai oldalon a böngésző tiltja a külső hívást. Helyben vagy saját tárhelyen futtatva magától frissül."); }
}
async function autoFxFetch(){
  try{
    if(typeof fetch!=="function")return;
    if(Date.now()-(state.fxLastFetch||0) < 12*3600*1000)return; // naponta max ~2x
    const r=await fxFetchCore();
    if(r.ok && currentPage==="invest")renderInvest();
  }catch(e){/* silent */}
}
function openFxAdd(){
  const dateI=el("input",{type:"date",value:todayISO()});
  const eurI=el("input",{type:"text",placeholder:"pl. 366,5"});
  const usdI=el("input",{type:"text",placeholder:"pl. 321,0"});
  const body=el("div",{},
    el("div",{class:"note"},el("span",{class:"em"},"ℹ"),el("div",{},"Add meg egy adott nap árfolyamát. Az EUR/USD-t az EUR/HUF ÷ USD/HUF-ből számolom. Azonos dátum felülírja a meglévőt.")),
    el("div",{class:"formgrid",style:"margin-top:12px"},
      field2("Dátum",dateI),el("div",{}),
      field2("EUR/HUF (1 EUR = ? Ft)",eurI),
      field2("USD/HUF (1 USD = ? Ft)",usdI)));
  showModal("Árfolyam rögzítése",body,[
    {label:"Mégse",cls:"ghost",onclick:closeModal},
    {label:"Mentés",cls:"",onclick:()=>{
      const eh=parseHUNumber(eurI.value), uh=parseHUNumber(usdI.value);
      if(isNaN(eh)&&isNaN(uh)){toast("Adj meg legalább egy árfolyamot");return;}
      if(!state.fxRates)state.fxRates=[];
      const dt=dateI.value||todayISO();
      const rec={date:dt,eurHuf:isNaN(eh)?0:eh,usdHuf:isNaN(uh)?0:uh};
      const ex=state.fxRates.find(x=>x.date===dt);
      if(ex)Object.assign(ex,rec); else state.fxRates.push(rec);
      save();closeModal();renderInvest();toast("Árfolyam mentve");
    }}]);
}

    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:cssVar("--muted"),font:{size:11}}},tooltip:{callbacks:{label:x=>x.dataset.label+": "+money(x.raw)}}},
      scales:{x:{ticks:{color:cssVar("--muted"),font:{size:10}},grid:{display:false}},y:{ticks:{color:cssVar("--muted"),font:{size:10},callback:v=>NUM.format(v)},grid:{color:cssVar("--border")}}}}});

function planMonthlyNeed(p){
  const nowYM=monthOf(todayISO());
  const target=p.month||nowYM;
  const remaining=Math.max(0,(p.amount||0)-(p.startAmount||0));
  let period;
  if(p.savePeriod&&p.savePeriod>0)period=Math.round(p.savePeriod);
  else period=Math.max(1,monthIdx(target)-monthIdx(nowYM)+1);
  const monthly=period>0?remaining/period:remaining;
  const saveStart=addMonthsYM(target,-(period-1));
  return {period,monthly,remaining,target,saveStart};
}

function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=el("a",{href:URL.createObjectURL(blob),download:"penzugyi-mentes-"+todayISO()+".json"});
  document.body.append(a);a.click();a.remove();toast("Mentés letöltve");
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);const fresh=freshState();state=Object.assign(fresh,s,{owners:Object.assign(fresh.owners,s.owners||{})});save();toast("Adatok visszatöltve");go("overview");}catch(err){toast("Hibás JSON fájl");}};
  r.readAsText(f);
}

function showModal(title,body,buttons){
  const modal=$("#modal");modal.innerHTML="";
  modal.append(el("div",{class:"mh"},el("h3",{},title),el("button",{class:"close",onclick:closeModal},"✕")));
  modal.append(el("div",{class:"mb"},body));
  const foot=el("div",{class:"mf",id:"modalFooter"});
  (buttons||[]).forEach(b=>foot.append(el("button",{class:"btn "+(b.cls||""),onclick:b.onclick},b.label)));
  modal.append(foot);
  $("#overlay").classList.add("open");
}
function closeModal(){$("#overlay").classList.remove("open");}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
